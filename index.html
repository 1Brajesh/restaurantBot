<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant List</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--b:#1f3a4d;--bg:#f6f6f4;--chip:#e4eef5}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:#222}
header{background:var(--b);color:#fff;padding:12px 14px}h1{margin:0;font-size:1.3rem}
.note{background:#fff7d6;border-left:4px solid #e0b300;padding:8px 12px;margin:10px 12px;font-size:.85rem;border-radius:4px}
.bar{position:sticky;top:0;z-index:1000;background:var(--bg);padding:8px 12px;border-bottom:1px solid #ddd}
#q{width:100%;font-size:1rem;padding:9px;border:1px solid #bbb;border-radius:8px}
.row{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.lbl{font-size:.72rem;color:#666;align-self:center;white-space:nowrap;min-width:52px}
.chip{border:1px solid #c5d3dd;background:#fff;border-radius:16px;padding:5px 11px;font-size:.82rem;white-space:nowrap;cursor:pointer;color:#234}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.85rem}
select{font-size:.85rem;padding:5px;border-radius:6px;border:1px solid #bbb}
.seg button{border:1px solid var(--b);background:#fff;color:var(--b);padding:5px 10px;font-size:.82rem;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button.on{background:var(--b);color:#fff}
#count{font-size:.8rem;color:#666;margin-left:auto}
main{padding:8px 12px 30px}
.card{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.1);cursor:pointer}
.top{display:flex;justify-content:space-between;gap:8px}.nm{font-weight:600}.dist{color:#555;font-size:.8rem;white-space:nowrap}
.meta{font-size:.82rem;color:#444;margin-top:3px}.meta span{margin-right:10px}
.tag{background:var(--chip);border-radius:10px;padding:1px 7px;font-size:.72rem}
.det{display:none;margin-top:8px;font-size:.85rem;border-top:1px solid #eee;padding-top:6px}.card.open .det{display:block}
.det p{margin:4px 0}.det b{color:#555}.nc{color:#999;font-style:italic}
#map{height:70vh;border-radius:8px;display:none}
.mini{font-size:.82rem;min-width:180px}.mini b{font-size:.92rem}
table{width:100%;border-collapse:collapse;background:#fff;font-size:.82rem}th,td{padding:6px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#e9eef2;position:sticky;top:0}
#tablewrap{display:none;overflow-x:auto}
details{margin-top:16px}summary{cursor:pointer;font-weight:600;color:#666;padding:6px 0}
details .card{opacity:.7}
@media(min-width:800px){main{max-width:1100px;margin:auto}#cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}#cards .card{margin:0}}
</style></head><body>
<header><h1>Restaurant List</h1></header>
<div class="note">Details came from earlier chats and haven't been verified. Information is as of October 2026; check with the restaurant before going. Distances are straight-line from Lincoln Road, Miami Beach.</div>
<div class="bar">
<input id="q" type="search" placeholder="Search name, dish, address...">
<div class="row" id="f-area"><span class="lbl">Area</span></div>
<div class="row" id="f-cuisine"><span class="lbl">Cuisine</span></div>
<div class="row" id="f-price"><span class="lbl">Price</span></div>
<div class="tools">
 <button class="chip" id="lunch">Open for lunch</button>
 <label>Sort <select id="sort"><option value="dist">Distance</option><option value="rating">Rating</option><option value="price">Price</option><option value="name">Name</option></select></label>
 <span class="seg"><button data-v="list" class="on">List</button><button data-v="map">Map</button><button data-v="table">Table</button></span>
 <span id="count"></span>
</div></div>
<main><div id="cards"></div><div id="map"></div><div id="tablewrap"></div><div id="closed"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const MB=[25.7907,-80.1300],AREAS=["South Beach / Miami Beach","North Beach","North Miami Beach","Bal Harbour","Wynwood / Midtown / Design District","Brickell","Downtown Miami","North Miami / Little River","Miami-Dade suburbs (west & south)","Broward County"];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={q:'',area:new Set,cuisine:new Set,price:new Set,lunch:false,sort:'dist',view:'list'};
let D=[],map,layer;
function miles(a,b){const R=3958.8,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function priceLvl(p){const m=(p||'').match(/^\s*(\$+)/);if(m)return Math.min(m[1].length,4);
 const n=(p||'').match(/\$(\d+)/);if(!n)return 0;const v=+n[1];return v<15?1:v<30?2:v<60?3:4}
function lunch(x){const h=(x.hours||'').toLowerCase(),all=(h+' '+(x.notes||'')).toLowerCase();
 if(/dinner only|dinner-focused|not a lunch|no weekday lunch/.test(all))return false;
 if(/lunch|brunch/.test(h))return true;
 if(/opens? (at )?noon|from 11|11(:\d\d)? ?am|noon|10 ?am|11-|opens 11/.test(h))return true;
 if(/lunch/.test((x.price||'').toLowerCase()))return true;return false}
const closed=x=>/PERMANENTLY CLOSED|^CLOSED/.test(x.notes||'');
const rnum=x=>{const m=(x.rating||'').match(/(\d\.\d)/);return m?+m[1]:0};
fetch('restaurants.json').then(r=>r.json()).then(d=>{D=d.map((x,i)=>({...x,i,lvl:priceLvl(x.price),lunchOK:lunch(x),closed:closed(x),r:rnum(x),mi:x.lat?miles(MB,[x.lat,x.lng]):null}));
 const areas=[...new Set(D.map(x=>x.city))].sort((a,b)=>AREAS.indexOf(a)-AREAS.indexOf(b));
 chips('f-area','area',areas);chips('f-cuisine','cuisine',[...new Set(D.map(x=>x.cuisine))].sort());chips('f-price','price',['$','$$','$$$','$$$$']);render()});
function chips(id,key,vals){const el=document.getElementById(id);vals.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=v.replace(' / Midtown / Design District',' / Midtown').replace('Miami-Dade suburbs (west & south)','Suburbs (W & S)');
 b.onclick=()=>{st[key].has(v)?st[key].delete(v):st[key].add(v);b.classList.toggle('on');render()};el.appendChild(b)})}
document.getElementById('q').oninput=e=>{st.q=e.target.value.toLowerCase();render()};
document.getElementById('lunch').onclick=e=>{st.lunch=!st.lunch;e.target.classList.toggle('on');render()};
document.getElementById('sort').onchange=e=>{st.sort=e.target.value;render()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');st.view=b.dataset.v;render()});
function filt(){return D.filter(x=>(!st.q||[x.name,x.cuisine,x.city,x.address,x.dishes,x.notes].join(' ').toLowerCase().includes(st.q))&&(!st.area.size||st.area.has(x.city))&&(!st.cuisine.size||st.cuisine.has(x.cuisine))&&(!st.price.size||st.price.has('$'.repeat(x.lvl)))&&(!st.lunch||x.lunchOK))}
function srt(a){const f={dist:(x,y)=>(x.mi??999)-(y.mi??999),rating:(x,y)=>y.r-x.r,price:(x,y)=>(x.lvl||9)-(y.lvl||9),name:(x,y)=>x.name.localeCompare(y.name)}[st.sort];return a.sort(f)}
const v=t=>t&&!/^not confirmed$/i.test(t)?esc(t):'<span class="nc">not confirmed</span>';
const dist=x=>x.mi!=null?x.mi.toFixed(1)+' mi':'';
function card(x){return `<div class="card" onclick="this.classList.toggle('open')"><div class="top"><span class="nm">${esc(x.name)}</span><span class="dist">${dist(x)}</span></div>
<div class="meta"><span class="tag">${esc(x.cuisine)}</span><span>${x.lvl?'$'.repeat(x.lvl):'<span class="nc">price ?</span>'}</span><span>${x.r?'★ '+x.r:''}</span><span>${esc(x.city)}</span></div>
<div class="det"><p><b>Price:</b> ${v(x.price)}</p><p><b>Dishes:</b> ${v(x.dishes)}</p>${x.hours?`<p><b>Hours:</b> ${esc(x.hours)}</p>`:''}<p><b>Address:</b> ${v(x.address)}</p>${x.rating?`<p><b>Rating:</b> ${esc(x.rating)}</p>`:''}${x.notes?`<p><b>Notes:</b> ${esc(x.notes)}</p>`:''}</div></div>`}
function render(){const all=srt(filt()),open=all.filter(x=>!x.closed),cl=all.filter(x=>x.closed);
 document.getElementById('count').textContent=open.length+' shown';
 const C=document.getElementById('cards'),M=document.getElementById('map'),T=document.getElementById('tablewrap');
 C.style.display=st.view=='list'?'':'none';M.style.display=st.view=='map'?'block':'none';T.style.display=st.view=='table'?'block':'none';
 if(st.view=='list')C.innerHTML=open.map(card).join('')||'<p>No matches.</p>';
 if(st.view=='table')T.innerHTML=`<table><tr><th>Name</th><th>Area</th><th>Cuisine</th><th>Price</th><th>Rating</th><th>Dist</th><th>Hours</th><th>Dishes</th><th>Address</th></tr>${open.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.city)}</td><td>${esc(x.cuisine)}</td><td>${v(x.price)}</td><td>${esc(x.rating)}</td><td>${dist(x)}</td><td>${esc(x.hours)}</td><td>${v(x.dishes)}</td><td>${v(x.address)}</td></tr>`).join('')}</table>`;
 if(st.view=='map')drawMap(open);
 document.getElementById('closed').innerHTML=cl.length?`<details><summary>Closed (${cl.length})</summary>${cl.map(card).join('')}</details>`:''}
function drawMap(list){if(!map){map=L.map('map').setView(MB,11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}
 setTimeout(()=>map.invalidateSize(),50);layer.clearLayers();const pts=[];
 list.filter(x=>x.lat).forEach(x=>{pts.push([x.lat,x.lng]);L.marker([x.lat,x.lng]).bindPopup(`<div class="mini"><b>${esc(x.name)}</b><br>${esc(x.cuisine)} · ${x.lvl?'$'.repeat(x.lvl):''} ${x.r?'· ★ '+x.r:''} · ${dist(x)}<br>${v(x.dishes)}<br><small>${esc(x.address)}</small></div>`).addTo(layer)});
 if(pts.length)map.fitBounds(pts,{padding:[20,20],maxZoom:14})}
</script></body></html>
